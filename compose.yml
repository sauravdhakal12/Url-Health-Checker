services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: urlchecker
      POSTGRES_USER: urlchecker
      POSTGRES_PASSWORD: urlchecker
    ports: ['7432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urlchecker']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
